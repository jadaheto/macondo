name: macondo-digital
services:
  db:
    image: postgres:16-alpine
    container_name: macondo_db
    environment:
      POSTGRES_USER: macondo
      POSTGRES_PASSWORD: macondo_dev
      POSTGRES_DB: macondo
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - macondo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macondo -d macondo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  macondo_pg:
